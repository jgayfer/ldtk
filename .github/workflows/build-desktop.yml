name: build-desktop

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            pack: npx electron-builder build --win --x64 --publish never
            artifact: windows-distribution
            path: app/redist/*.exe
          - os: macos-latest
            pack: npx electron-builder build --mac --universal --publish never
            artifact: mac-distribution
            path: app/redist/*.dmg
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.3
      - run: haxe setup.hxml
      # setup.hxml installs the Haxe API from master; this branch needs its matching dev branch.
      - run: haxelib git ldtk-haxe-api https://github.com/deepnight/ldtk-haxe-api.git dev-1.5.4 --always
      - run: haxelib list

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: cd app && npm install
      - run: cd app && npm run pack-prepare
      - run: cd app && ${{ matrix.pack }}
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
